# Every PR: the branch prefix, then the lint, plugin validation and smoke test, as
# `make check` runs them locally.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # The branch name says what kind of change the PR is. Rename a claude/ branch before opening a PR.
      - name: Branch prefix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            feat/*|fix/*|chore/*|docs/*|refactor/*|test/*|perf/*|ci/*|build/*|revert/*) ;;
            *)
              echo "::error::Branch '$HEAD_REF' needs one of these prefixes: feat/ fix/ chore/ docs/ refactor/ test/ perf/ ci/ build/ revert/"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Checks
        run: make check
